<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robotklippere</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.3rem; font-weight: 600; }
    #last-updated { font-size: 0.75rem; opacity: 0.7; text-align: right; }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr 1fr 1fr;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .card.full-width { grid-column: 1 / -1; }

    .card-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #888;
      margin-bottom: 16px;
    }

    .mower-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    /* Cramer: namn + sist-oppdatert tidsstempel på same rad */
    .name-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .name-row .mower-name { margin-bottom: 0; }
    .name-ts {
      font-size: 0.72rem;
      color: #999;
      white-space: nowrap;
    }

    .status-big {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .battery-wrap { margin-bottom: 16px; }
    .battery-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #555;
    }
    .battery-bar {
      height: 10px;
      background: #e0e0e0;
      border-radius: 5px;
      overflow: hidden;
    }
    .battery-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.5s;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 1rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: #666; }
    .info-value { font-weight: 600; }

    .error-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 12px;
    }
    .pill-ok   { background: #e8f5e9; color: #2e7d32; }
    .pill-warn { background: #ffebee; color: #c62828; }
    .pill-gray { background: #f5f5f5; color: #888; }
    .pill-dot  { width: 8px; height: 8px; border-radius: 50%; }
    .pill-dot-green { background: #43a047; }
    .pill-dot-red   { background: #e53935; }
    .pill-dot-gray  { background: #aaa; }

    /* Botnrad: feilpill + klippetid-chips */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
    }
    .card-footer .error-pill { margin-top: 0; }
    .cut-chips { display: flex; gap: 8px; }
    .cut-chip {
      background: #f0f7f0;
      border-radius: 12px;
      padding: 4px 12px;
      text-align: center;
      line-height: 1.25;
      min-width: 62px;
    }
    .cut-chip .cut-label {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
    }
    .cut-chip .cut-value {
      font-size: 0.85rem;
      font-weight: 700;
      color: #2e7d32;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
    }
    .stat-col {
      padding: 0 16px;
      border-right: 1px solid #f0f0f0;
    }
    .stat-col:first-child { padding-left: 0; }
    .stat-col:last-child  { border-right: none; padding-right: 0; }
    .stat-col h3 {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #888;
      margin-bottom: 12px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-bottom: 1px solid #f5f5f5;
      font-size: 0.88rem;
    }
    .stat-item:last-child { border-bottom: none; }
    .stat-label { color: #666; }
    .stat-value { font-weight: 600; }

    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 20px 0; }
      .stat-col { border-right: none; border-bottom: 1px solid #f0f0f0; padding: 16px 0; }
      .stat-col:nth-child(odd) { padding-right: 12px; border-right: 1px solid #f0f0f0; }
      .stat-col:last-child { border-bottom: none; }
    }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
      .stat-col { border-right: none !important; }
    }

    #loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px;
      color: #888;
    }
  </style>
</head>
<body>

<header>
  <div>
    <div style="font-size:0.75rem; opacity:0.5; margin-bottom:4px;">Siljan kommune — IoT</div>
    <h1>🌿 Robotklippere</h1>
  </div>
  <div id="last-updated">Henter data...</div>
</header>

<main id="main">
  <div id="loading">Laster status...</div>
</main>

<script>
const SUPA_URL = "https://fdqjiubwnohtucpercro.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkcWppdWJ3bm9odHVjcGVyY3JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMzMwOTAsImV4cCI6MjA4OTkwOTA5MH0.31n5oId96UEOB7Hf-rSCJ_DG57SNWNPJfeiCFDbW_vQ";

// ── Husqvarna-konfig ──────────────────────────────────────────────────────────
const MOWER_NAMES = {
  "535_awd_sagaengabak":      "Sagaenga bak",
  "535_bofelleskap":          "Bofellesskap",
  "am520_epos_sagaengaforan": "Sagaenga foran",
  "biblioteket":              "Biblioteket",
  "midtbygda_skole":          "Midtbygda skole",
};

const MOWER_ORDER = [
  "535_awd_sagaengabak",
  "am520_epos_sagaengaforan",
  "535_bofelleskap",
  "biblioteket",
  "midtbygda_skole",
];

const MOWER_MODELS = {
  "535_awd_sagaengabak":      "Automower 535 AWD",
  "535_bofelleskap":          "Automower 535",
  "am520_epos_sagaengaforan": "Automower AM520 EPOS",
  "biblioteket":              "Automower 520 EPOS",
  "midtbygda_skole":          "Automower",
};

const STATE_LABELS = {
  docked:    "Parkert",
  mowing:    "Klipper",
  paused:    "Pauset",
  error:     "FEIL",
  returning: "Returnerer",
  charging:  "Lader",
};

const RESTRICTED_LABELS = {
  week_schedule:            "Ukeplan",
  park_override:            "Parkert manuelt",
  sensor_problem:           "Sensorproblem",
  all_work_areas_completed: "Alle soner fullfort",
  not_applicable:           "Ingen",
  none:                     "—",
};

// ── Cramer-konfig ─────────────────────────────────────────────────────────────
const CRAMER_NAMES = {
  "221100850": "Sykehjemmet",
};

const CRAMER_STATUS_LABELS = {
  "Charging":   "Lader",
  "Mowing":     "Klipper",
  "Parked":     "Parkert",
  "Paused":     "Pauset",
  "Error":      "FEIL",
  "Leaving":    "Starter",
  "Searching":  "Soker",
  "Going home": "Returnerer",
};

// ── Hjelpefunksjonar ──────────────────────────────────────────────────────────
function batteryColor(pct) {
  if (pct >= 60) return "#43a047";
  if (pct >= 30) return "#fb8c00";
  return "#e53935";
}

function stateColor(state) {
  if (state === "mowing")    return "#43a047";
  if (state === "error")     return "#e53935";
  if (state === "paused")    return "#fb8c00";
  if (state === "returning") return "#fb8c00";
  return "#43a047";
}

function cramerStatusColor(subStatusText, isOnline) {
  if (!isOnline) return "#aaa";
  const s = (subStatusText || "").toLowerCase();
  if (s === "mowing")                    return "#43a047";
  if (s === "error")                     return "#e53935";
  if (s === "paused" || s === "leaving") return "#fb8c00";
  if (s === "going home")                return "#fb8c00";
  return "#43a047";
}

function formatDate(iso) {
  if (!iso) return "—";
  const d   = new Date(iso);
  const dd  = String(d.getDate()).padStart(2, "0");
  const mm  = String(d.getMonth() + 1).padStart(2, "0");
  const hh  = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  return `${dd}.${mm} kl. ${hh}:${min}`;
}

function formatHours(h) {
  if (h === null || h === undefined) return "—";
  const days = Math.floor(h / 24);
  const hrs  = Math.round(h % 24);
  return days > 0 ? `${days}d ${hrs}t` : `${hrs}t`;
}

// ── Kortmalar ─────────────────────────────────────────────────────────────────
function mowerCard(d) {
  const name     = MOWER_NAMES[d.mower_id] ?? d.mower_id;
  const model    = MOWER_MODELS[d.mower_id] ?? "";
  const state    = d.state ?? "unknown";
  const label    = STATE_LABELS[state] ?? state;
  const color    = stateColor(state);
  const pct      = d.battery ?? 0;
  const bColor   = batteryColor(pct);
  const hasError = d.error && d.error !== "no_error";

  return `
  <div class="card">
    <div class="card-title">${model}</div>
    <div class="mower-name">${name}</div>
    <div class="status-big">
      <span class="status-dot" style="background:${color}"></span>
      <span class="status-text" style="color:${color}">${label}</span>
    </div>
    <div class="battery-wrap">
      <div class="battery-label">
        <span>Batteri</span>
        <span>${pct}%${d.is_charging ? " — Lader" : ""}</span>
      </div>
      <div class="battery-bar">
        <div class="battery-fill" style="width:${pct}%; background:${bColor}"></div>
      </div>
    </div>
    <div class="info-row">
      <span class="info-label">Sist fullfort</span>
      <span class="info-value">${d.last_completed_at ? formatDate(d.last_completed_at) : "Ikke tilgjengelig"}</span>
    </div>
    <div class="info-row">
      <span class="info-label">Neste start</span>
      <span class="info-value">${formatDate(d.next_start)}</span>
    </div>
    <div class="error-pill ${hasError ? "pill-warn" : "pill-ok"}">
      <span class="pill-dot ${hasError ? "pill-dot-red" : "pill-dot-green"}"></span>
      ${hasError ? d.error : "Ingen feil"}
    </div>
  </div>`;
}

function formatFull(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function formatHms(seconds) {
  if (!seconds || seconds <= 0) return "0t";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return m > 0 ? `${h}t ${m}min` : `${h}t`;
}

// Reknar ut neste klippehending frå Cramer sin kalender (schedule-JSON).
// Inne i eit aktivt vindauge -> "Klipper til HH:MM". Utanfor -> "Neste start ...".
function cramerNextEvent(schedule) {
  if (!schedule || !schedule.weekDays1) return { label: "Neste start", value: "—" };

  const now    = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const todaySI = (now.getDay() + 6) % 7;   // 0=man .. 6=søn

  const fmt = (min) =>
    `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;

  function windows(si) {
    const wins = [];
    for (const wd of [schedule.weekDays1, schedule.weekDays2]) {
      const e = wd && wd[si];
      if (e && e.isEnabled) {
        const start = e.startHour * 60 + e.startMinute;
        const end   = e.endHour   * 60 + e.endMinute;
        if (end > start) wins.push({ start, end });
      }
    }
    return wins.sort((a, b) => a.start - b.start);
  }

  // Inne i eit vindauge i dag?
  for (const w of windows(todaySI)) {
    if (nowMin >= w.start && nowMin < w.end) {
      return { label: "Klipper til", value: fmt(w.end) };
    }
  }

  // Finn neste start innan 7 dagar
  const WD = ["man", "tir", "ons", "tor", "fre", "lør", "søn"];
  for (let off = 0; off < 8; off++) {
    const si = (todaySI + off) % 7;
    for (const w of windows(si)) {
      if (off === 0 && w.start <= nowMin) continue;
      let when;
      if      (off === 0) when = `kl. ${fmt(w.start)}`;
      else if (off === 1) when = `i morgen ${fmt(w.start)}`;
      else                when = `${WD[si]} ${fmt(w.start)}`;
      return { label: "Neste start", value: when };
    }
  }
  return { label: "Neste start", value: "—" };
}

function cramerCard(d, cut) {
  const name      = CRAMER_NAMES[d.mower_id] ?? d.device_name ?? d.mower_id;
  const model     = d.model_description ?? d.model_name ?? "Cramer";
  const rawStatus = d.sub_status_text ?? "—";
  const label     = CRAMER_STATUS_LABELS[rawStatus] ?? rawStatus;
  let   color     = cramerStatusColor(rawStatus, d.is_online);
  const pct       = d.battery ?? 0;
  const bColor    = batteryColor(pct);
  const offline   = !d.is_online;

  const todayH    = cut.today_s   > 0 ? formatHms(cut.today_s)   : "0t";
  const last24H   = cut.last24h_s > 0 ? formatHms(cut.last24h_s) : "0t";
  const next      = cramerNextEvent(d.schedule);
  const hasError  = d.error_text && d.error_text.trim().length > 0;
  // Frakobling eller reell feil → raud status-tekst (overstyrer grå/grøn)
  if (offline || hasError) color = "#e53935";

  return `
  <div class="card">
    <div class="card-title">${model}</div>
    <div class="name-row">
      <span class="mower-name">${name}</span>
      <span class="name-ts">${formatFull(d.updated_at)}</span>
    </div>
    <div class="status-big">
      <span class="status-dot" style="background:${color}"></span>
      <span class="status-text" style="color:${color}">${offline ? "Frakoblet" : label}</span>
    </div>
    <div class="battery-wrap">
      <div class="battery-label">
        <span>Batteri</span>
        <span>${pct}%${d.is_charging ? " — Lader" : ""}</span>
      </div>
      <div class="battery-bar">
        <div class="battery-fill" style="width:${pct}%; background:${bColor}"></div>
      </div>
    </div>
    <div class="info-row">
      <span class="info-label">Sist fullført</span>
      <span class="info-value">${d.last_completed_at ? formatDate(d.last_completed_at) : "Ikke tilgjengelig"}</span>
    </div>
    <div class="info-row">
      <span class="info-label">${next.label}</span>
      <span class="info-value">${next.value}</span>
    </div>
    <div class="card-footer">
      <div class="error-pill ${hasError ? "pill-warn" : "pill-ok"}">
        <span class="pill-dot ${hasError ? "pill-dot-red" : "pill-dot-green"}"></span>
        ${hasError ? d.error_text : "Ingen feil"}
      </div>
      <div class="cut-chips">
        <div class="cut-chip">
          <div class="cut-label">Idag</div>
          <div class="cut-value">${todayH}</div>
        </div>
        <div class="cut-chip">
          <div class="cut-label">Siste døgn</div>
          <div class="cut-value">${last24H}</div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── Last og render ────────────────────────────────────────────────────────────
async function load() {
  const headers = { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` };

  const [husqRes, cramerRes, cuttingRes] = await Promise.all([
    fetch(`${SUPA_URL}/rest/v1/husqvarna_status?select=*&order=mower_id`, { headers }),
    fetch(`${SUPA_URL}/rest/v1/cramer_status?select=*`, { headers }),
    fetch(`${SUPA_URL}/rest/v1/cramer_cutting_times?select=*`, { headers }),
  ]);

  const mowers  = await husqRes.json();
  const cramers = await cramerRes.json();
  const cutting = await cuttingRes.json();

  const cuttingMap = Object.fromEntries((cutting || []).map(c => [c.mower_id, c]));

  if (!mowers.length && !cramers.length) {
    document.getElementById("main").innerHTML = '<div id="loading">Ingen data funnet.</div>';
    return;
  }

  const allUpdated = [...mowers, ...cramers]
    .map(x => x.updated_at).filter(Boolean).sort();
  if (allUpdated.length) {
    document.getElementById("last-updated").innerHTML =
      `Oppdatert: ${formatDate(allUpdated.at(-1))}`;
  }

  mowers.sort((a, b) => MOWER_ORDER.indexOf(a.mower_id) - MOWER_ORDER.indexOf(b.mower_id));

  document.getElementById("main").innerHTML = [
    ...mowers.map(mowerCard),
    ...cramers.map(c => cramerCard(c, cuttingMap[c.mower_id] || {})),
  ].join("");
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
