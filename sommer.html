<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sommer i Siljan – badetemperaturer</title>
<style>
  /* ---------- Fargepalett ---------- */
  :root{
    --himmel:      #5DB7E0;   /* himmelblå */
    --himmel-lys:  #9BD8F0;
    --sol:         #FFC93C;   /* sol-gul */
    --sol-djup:    #F4A93C;
    --sand:        #F6CE9E;   /* ørken/sand */
    --sand-lys:    #FBE3C4;
    --korall:      #F0656B;   /* "Fredag"-raud */
    --lilla:       #B95C9D;   /* "Lørdag"-lilla */
    --teal:        #45B79C;   /* "Søndag"-grøn */
    --krem:        #FFF6E9;   /* bakgrunn */
    --blekk:       #3E2F2A;   /* mørk varm brun tekst */
    --blekk-mjuk:  #7A675E;
    --kort-skugge: 0 10px 30px rgba(62,47,42,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--blekk);
    background:
      radial-gradient(1200px 600px at 80% -10%, var(--himmel-lys), transparent 60%),
      linear-gradient(180deg, var(--himmel) 0%, var(--krem) 38%, var(--krem) 100%);
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- 16:9 infoskjerm-ramme (1920x1080) ---------- */
  .skjerm{
    width:min(100vw,1920px);
    margin:0 auto;
    padding:clamp(18px,2.6vw,48px);
    display:flex;
    flex-direction:column;
    gap:clamp(16px,1.8vw,32px);
    min-height:100vh;
  }

  /* ---------- Topptekst ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:24px;flex-wrap:wrap;
  }
  .merke{display:flex;align-items:center;gap:18px}
  .sol-ikon{
    width:clamp(56px,5vw,86px);height:clamp(56px,5vw,86px);
    border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #FFE07A, var(--sol) 55%, var(--sol-djup));
    box-shadow:0 0 0 8px rgba(255,201,60,.25), 0 10px 24px rgba(244,169,60,.45);
    position:relative;flex-shrink:0;
  }
  .tittel h1{
    font-size:clamp(1.7rem,3.4vw,3.4rem);
    font-weight:800;letter-spacing:-.02em;line-height:1;
    color:var(--korall);
  }
  .tittel .under{
    font-size:clamp(.8rem,1.3vw,1.25rem);
    color:var(--teal);font-weight:700;margin-top:6px;
  }
  .klokke{text-align:right}
  .klokke .tid{font-size:clamp(1.6rem,2.8vw,2.8rem);font-weight:800;line-height:1;color:var(--blekk)}
  .klokke .dato{font-size:clamp(.75rem,1.1vw,1.05rem);color:var(--blekk-mjuk);text-transform:capitalize;margin-top:4px}

  /* ---------- Seksjonstittel ---------- */
  .seksjon-tittel{
    font-size:clamp(.95rem,1.4vw,1.35rem);font-weight:800;
    text-transform:uppercase;letter-spacing:.06em;
    display:flex;align-items:center;gap:10px;color:var(--blekk);
  }
  .seksjon-tittel::after{content:"";flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--sol),transparent)}

  /* ---------- Badetemp-kort (hovudelement) ---------- */
  .bade-grid{
    display:grid;gap:clamp(14px,1.6vw,28px);
    grid-template-columns:repeat(3,1fr);
  }
  .bade-kort{
    position:relative;overflow:hidden;
    border-radius:26px;padding:clamp(20px,2vw,34px);
    background:#fff;box-shadow:var(--kort-skugge);
    min-height:clamp(220px,24vw,320px);
    display:flex;flex-direction:column;justify-content:flex-start;
    border:2px solid rgba(93,183,224,.18);
  }
  .bade-bunn{margin-top:auto;padding-top:14px}
  .bade-kort .bolge{
    position:absolute;left:0;right:0;bottom:0;height:22%;
    background:linear-gradient(180deg, rgba(93,183,224,.08), rgba(69,183,156,.16));
    border-radius:0 0 24px 24px;
    z-index:0;
  }
  .bade-kort > *{position:relative;z-index:1}
  .bade-namn{font-size:clamp(1.05rem,1.5vw,1.6rem);font-weight:800}
  .bade-stad{font-size:clamp(.72rem,1vw,.95rem);color:var(--blekk-mjuk);margin-top:2px}
  .bade-temp{
    font-size:clamp(3rem,6vw,5.6rem);font-weight:800;line-height:.9;
    letter-spacing:-.03em;display:flex;align-items:flex-start;gap:6px;
  }
  .bade-temp .grad{font-size:.42em;font-weight:700;margin-top:.3em}
  .bade-merkelapp{
    display:inline-block;align-self:flex-start;
    padding:5px 14px;border-radius:999px;color:#fff;font-weight:700;
    font-size:clamp(.7rem,.95vw,.95rem);
  }
  .bade-under{font-size:clamp(.8rem,1.05vw,1.05rem);font-weight:600;color:var(--blekk);font-style:italic;margin-top:6px;min-height:1.2em}
  .bade-oppd{font-size:clamp(.66rem,.85vw,.82rem);color:var(--blekk-mjuk)}
  .bade-vannkval{margin-top:8px}
  .bade-vannkval .bv-status{display:flex;align-items:center;gap:7px;font-size:clamp(.72rem,.95vw,.9rem);color:var(--blekk);font-weight:600}
  .bade-vannkval .bv-prikk{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .bade-kilde{font-size:clamp(.6rem,.78vw,.74rem);color:var(--blekk-mjuk);opacity:.75;margin-top:6px}
  .bade-kilde a{color:var(--himmel);text-decoration:underline;text-underline-offset:2px}
  .bade-kilde a:hover{color:var(--korall)}
  .venter{color:var(--blekk-mjuk);font-style:italic;font-size:1rem}

  /* ---------- Nedre rad: luft, vêr, sol, info ---------- */
  .nede-grid{
    display:grid;gap:clamp(14px,1.6vw,28px);
    grid-template-columns:repeat(4,1fr);
  }
  .info-kort{
    background:#fff;border-radius:22px;padding:clamp(16px,1.5vw,26px);
    box-shadow:var(--kort-skugge);display:flex;flex-direction:column;gap:8px;
    border-top:6px solid var(--sol);
  }
  .info-kort.luft{border-top-color:var(--korall)}
  .info-kort.sol{border-top-color:var(--sol-djup)}
  .info-kort.vaer{border-top-color:var(--himmel)}
  .info-kort.fare{border-top-color:var(--teal)}
  .info-kort.uv{border-top-color:var(--lilla)}
  .info-kort.pollen{border-top-color:var(--teal)}
  .pollen-rad{display:flex;justify-content:space-between;align-items:center;font-size:clamp(.78rem,1vw,.95rem)}
  .pollen-namn{color:var(--blekk);font-weight:600}
  .pollen-nivaa{padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:#fff}
  .info-kort .etikett{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--blekk-mjuk);font-weight:700}
  .info-kort .stor{font-size:clamp(1.8rem,3vw,2.8rem);font-weight:800;line-height:1}
  .info-kort .liten{font-size:clamp(.78rem,1vw,.98rem);color:var(--blekk-mjuk)}
  .sol-rad{display:flex;justify-content:space-between;gap:8px;font-size:clamp(.85rem,1.1vw,1.05rem);font-weight:700}
  .sol-rad .lab{display:block;font-size:.7rem;color:var(--blekk-mjuk);font-weight:600;text-transform:uppercase}

  footer{
    text-align:center;color:var(--blekk-mjuk);font-size:clamp(.7rem,.95vw,.9rem);
    padding-top:6px;
  }
  .bie{display:inline-block;animation:sveve 3s ease-in-out infinite}
  @keyframes sveve{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}

  /* ---------- Mobil ---------- */
  @media (max-width:1100px){
    .bade-grid{grid-template-columns:1fr}
    .nede-grid{grid-template-columns:1fr 1fr}
  }
  @media (max-width:560px){
    .nede-grid{grid-template-columns:1fr}
    header{justify-content:center;text-align:center}
    .klokke{text-align:center;width:100%}
  }
</style>
</head>
<body>
<div class="skjerm">

  <header>
    <div class="merke">
      <div class="sol-ikon"></div>
      <div class="tittel">
        <h1>Sommer i Siljan</h1>
        <div class="under">Badetemperaturer &amp; vær · oppdateres direkte</div>
      </div>
    </div>
    <div class="klokke">
      <div class="tid" id="klokke">--:--</div>
      <div class="dato" id="dato">—</div>
    </div>
  </header>

  <section>
    <div class="seksjon-tittel">🌊 Badetemperaturer</div>
    <div class="bade-grid" id="bade-grid"><!-- kort genereres --></div>
  </section>

  <section>
    <div class="seksjon-tittel">☀️ Vær i Siljan i dag</div>
    <div class="nede-grid">
      <div class="info-kort luft">
        <div class="etikett">Lufttemperatur</div>
        <div class="stor" id="luft-temp">—</div>
        <div class="liten" id="luft-kjelde">Netatmo værstasjon</div>
      </div>
      <div class="info-kort uv">
        <div class="etikett">UV-indeks nå</div>
        <div class="stor" id="uv-verdi">—</div>
        <div class="liten" id="uv-tekst">—</div>
      </div>
      <div class="info-kort sol">
        <div class="etikett">Sol i dag</div>
        <div class="sol-rad">
          <div><span class="lab">Opp</span><span id="sol-opp">—</span></div>
          <div><span class="lab">Ned</span><span id="sol-ned">—</span></div>
        </div>
        <div class="liten" id="dag-lengd">—</div>
      </div>
      <div class="info-kort pollen">
        <div class="etikett">Pollen (Yr)</div>
        <div id="pollen-liste" style="display:flex;flex-direction:column;gap:6px;margin-top:4px"></div>
      </div>
    </div>
  </section>

  <footer>
    <span class="bie">🐝</span> Siljan kommune · Sommer 2026 · data oppdateres automatisk
  </footer>

</div>

<script>
/* ====================================================================
   KONFIGURASJON — fyll inn API-lenkene når dei er klare
   ==================================================================== */
const CONFIG = {
  steder: [
    { navn:"Øverbøtjønna", stad:"Siljan", kilde:"Siljan kommune", badevannKey:"overbotjonn",
      api:"https://fdqjiubwnohtucpercro.supabase.co/functions/v1/badetemperatur" },
    { navn:"Gorningen",    stad:"Gorningen badeplass", kilde:"Siljan kommune",
      api:"https://fdqjiubwnohtucpercro.supabase.co/functions/v1/api-gorningen" },
    { navn:"Heivannet",    stad:"Heivannet", kilde:"yr.no", badevannKey:"heivannet",
      api:"https://fdqjiubwnohtucpercro.supabase.co/functions/v1/api-heivannet" },
  ],
  // Netatmo-temp pusha frå Home Assistant til Supabase (URL kjem):
  luftApi: null,
  // Badevannskvalitet (Miljørettet helsevern i Grenland, skrapa frå Porsgrunn kommune):
  badevannApi: "https://fdqjiubwnohtucpercro.supabase.co/functions/v1/api-badevann",
  // Pollen via proxy-funksjon (NAAF-data, server-side henta frå Yr):
  pollenApi: "https://fdqjiubwnohtucpercro.supabase.co/functions/v1/api-pollen",
  // Koordinatar Siljan sentrum (UV + sol opp/ned frå api.met.no):
  lat: 59.30, lon: 9.78,
  oppdaterMs: 5*60*1000   // 5 min
};

/* ---------- Hjelpefunksjoner ---------- */
const $ = s => document.querySelector(s);

function tempFarge(t){
  // tekster synkronisert med badetemp-overbotjonna.html; varmt = grønt
  if(t==null) return {bg:"#cfcfcf", txt:"Ingen data", under:""};
  if(t < 10)  return {bg:"#4FA8D8", txt:"Iskaldt!",   under:"Kun for de tøffeste"};
  if(t < 15)  return {bg:"#45B79C", txt:"Friskt!",    under:"Forfriskende bad"};
  if(t < 18)  return {bg:"#7FB845", txt:"Behagelig",  under:"Fint badevann"};
  if(t < 22)  return {bg:"#57B84A", txt:"Deilig!",    under:"Perfekt badetemperatur"};
  return            {bg:"#2E9E54", txt:"Tropisk!",   under:"Hopp rett uti!"};
}

function klokkeslett(iso){
  if(!iso) return "";
  return new Date(iso).toLocaleTimeString("no", {hour:"2-digit", minute:"2-digit"});
}

function tidsstempel(iso){
  if(!iso) return "";
  const d = new Date(iso);
  const dato = d.toLocaleDateString("no", {day:"numeric", month:"short"});
  const tid  = d.toLocaleTimeString("no", {hour:"2-digit", minute:"2-digit"});
  return `${dato} kl ${tid}`;
}

/* ---------- Bygg badetemperatur-kort ---------- */
function byggBadeKort(){
  const grid = $("#bade-grid");
  grid.innerHTML = "";
  CONFIG.steder.forEach((s,i)=>{
    const el = document.createElement("div");
    el.className = "bade-kort";
    el.innerHTML = `
      <div>
        <div class="bade-namn">${s.navn}</div>
        <div class="bade-stad">${s.stad}</div>
      </div>
      <div class="bade-temp" id="temp-${i}"><span class="venter">Henter data…</span></div>
      <div class="bade-under" id="under-${i}"></div>
      <div class="bade-bunn">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span class="bade-merkelapp" id="merke-${i}" style="background:#cfcfcf">—</span>
          <span class="bade-oppd" id="oppd-${i}"></span>
        </div>
        ${s.badevannKey
          ? `<div class="bade-vannkval" id="badevann-${i}"></div>`
          : `<div class="bade-vannkval" aria-hidden="true" style="visibility:hidden"><div class="bv-status"><span class="bv-prikk"></span>Badevannskvalitet: God</div></div>`}
        <div class="bade-kilde">Kilde: ${s.kilde}</div>
        ${s.badevannKey
          ? `<div class="bade-kilde" id="badevann-kilde-${i}"></div>`
          : `<div class="bade-kilde" aria-hidden="true" style="visibility:hidden">Kilde badevann: —</div>`}
      </div>
      <div class="bolge"></div>`;
    grid.appendChild(el);
  });
}

/* ---------- Hent badetemperaturer ---------- */
async function hentBade(){
  for(let i=0;i<CONFIG.steder.length;i++){
    const s = CONFIG.steder[i];
    const tempEl = $("#temp-"+i), merkeEl = $("#merke-"+i), oppdEl = $("#oppd-"+i), underEl = $("#under-"+i);
    if(!s.api){
      tempEl.innerHTML = `<span class="venter">API kommer</span>`;
      continue;
    }
    try{
      const r = await fetch(s.api, {cache:"no-store"});
      if(!r.ok) throw new Error(r.status);
      const j = await r.json();
      let t, ts;
      if(s.yrLocationId){
        // Yr badetemperaturer: array av alle stasjoner
        const arr = Array.isArray(j) ? j : [j];
        const entry = arr.find(x=>x.locationId===s.yrLocationId);
        t  = entry?.temperature;
        ts = entry?.time;
      } else {
        // Supabase: {temperatur, rapportert} eller {sensors:{temp_water}, timestamp}
        t  = j?.temperatur ?? j?.sensors?.temp_water;
        ts = j?.rapportert ?? j?.timestamp;
      }
      const f = tempFarge(t);
      if(t==null){ tempEl.innerHTML = `<span class="venter">Ingen data</span>`; continue; }
      tempEl.innerHTML = `${Number(t).toFixed(1).replace('.',',')}<span class="grad">°C</span>`;
      merkeEl.textContent = f.txt;
      merkeEl.style.background = f.bg;
      if(underEl) underEl.textContent = f.under || "";
      oppdEl.textContent = ts ? tidsstempel(ts) : "";
    }catch(e){
      tempEl.innerHTML = `<span class="venter">Ikke tilgjengelig</span>`;
    }
  }
}

/* ---------- Hent badevannskvalitet (Miljørettet helsevern, via proxy) ---------- */
async function hentBadevann(){
  if(!CONFIG.badevannApi) return;
  const harBadevann = CONFIG.steder.some(s => s.badevannKey);
  if(!harBadevann) return;
  try{
    const r = await fetch(CONFIG.badevannApi, {cache:"no-store"});
    const j = await r.json();
    CONFIG.steder.forEach((s,i)=>{
      if(!s.badevannKey) return;
      const el = $("#badevann-"+i);
      if(!el) return;
      const d = j?.steder?.[s.badevannKey];
      if(d && d.kvalitet){
        const kilde = j?.kilde || "Miljørettet helsevern i Grenland";
        el.innerHTML =
          `<div class="bv-status"><span class="bv-prikk" style="background:${d.farge||'#aaa'}"></span>` +
          `Badevannskvalitet: <strong style="margin-left:2px">${d.kvalitet}</strong></div>`;
        const kildeEl = $("#badevann-kilde-"+i);
        if(kildeEl) kildeEl.innerHTML =
          `Kilde badevann: <a href="https://www.porsgrunn.kommune.no/badevannet-i-porsgrunn/" ` +
          `target="_blank" rel="noopener">${kilde}</a>`;
      }
    });
  }catch(e){ console.warn("Badevann feil:", e); }
}

/* ---------- Hent lufttemperatur (Netatmo via Supabase) ---------- */
async function hentLuft(){
  if(!CONFIG.luftApi){ return; }
  try{
    const r = await fetch(CONFIG.luftApi, {cache:"no-store"});
    const j = await r.json();
    const t = j?.sensors?.temp_air ?? j?.temperature;
    $("#luft-temp").innerHTML = (t!=null) ? `${Number(t).toFixed(1).replace('.',',')} °C` : "—";
    if(j?.timestamp) $("#luft-kjelde").textContent = "Netatmo · " + klokkeslett(j.timestamp);
  }catch(e){}
}

/* ---------- Vær: UV + sol direkte fra api.met.no (har CORS), pollen via proxy ---------- */
const MET_FORECAST = `https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=${CONFIG.lat}&lon=${CONFIG.lon}`;
const MET_SUN = `https://api.met.no/weatherapi/sunrise/3.0/sun?lat=${CONFIG.lat}&lon=${CONFIG.lon}`;

const UV_TEKST  = ["Lav","Lav","Lav","Moderat","Moderat","Moderat","Høy","Høy","Svært høy","Svært høy","Svært høy","Ekstrem"];
const UV_FARGE  = ["#45B79C","#45B79C","#45B79C","#F4A93C","#F4A93C","#F4A93C","#F0656B","#F0656B","#B95C9D","#B95C9D","#B95C9D","#3E2F2A"];
const POLLEN_FARGE = {
  "Ingen":       "#aaa",
  "Ubetydelig":  "#7FB845",
  "Beskjeden":   "#F4A93C",
  "Moderat":     "#F0656B",
  "Betydelig":   "#B95C9D",
  "Sterk":       "#3E2F2A",
};

async function hentVaer(){
  const fmt = iso => iso ? new Date(iso).toLocaleTimeString("no",{hour:"2-digit",minute:"2-digit"}) : "—";

  // --- UV-indeks + lufttemp (fallback) fra api.met.no ---
  try{
    const r = await fetch(MET_FORECAST, {cache:"no-store"});
    const j = await r.json();
    const serie = j?.properties?.timeseries || [];
    const now = Date.now();
    // nærmeste tidspunkt til nå
    const naa = serie.reduce((best, x) =>
      Math.abs(new Date(x.time) - now) < Math.abs(new Date(best.time) - now) ? x : best
    , serie[0]);
    const det = naa?.data?.instant?.details || {};
    const uv = det.ultraviolet_index_clear_sky;
    if(uv != null){
      const idx = Math.min(Math.round(uv), 11);
      $("#uv-verdi").textContent = Number(uv).toFixed(1).replace(".",",");
      $("#uv-tekst").textContent = UV_TEKST[idx];
      $("#uv-verdi").style.color = UV_FARGE[idx];
    }
    if(!CONFIG.luftApi){
      const t = det.air_temperature;
      if(t != null){
        $("#luft-temp").innerHTML = `${Number(t).toFixed(1).replace(".",",")} °C`;
        $("#luft-kjelde").textContent = "Yr / met.no · Siljan";
      }
    }
  }catch(e){ console.warn("met.no forecast feil:", e); }

  // --- Sol opp/ned fra api.met.no sunrise 3.0 ---
  try{
    const d = new Date();
    const dato = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const r = await fetch(`${MET_SUN}&date=${dato}&offset=+02:00`, {cache:"no-store"});
    const j = await r.json();
    const opp = j?.properties?.sunrise?.time;
    const ned = j?.properties?.sunset?.time;
    $("#sol-opp").textContent = fmt(opp);
    $("#sol-ned").textContent = fmt(ned);
    if(opp && ned){
      const mins = Math.round((new Date(ned) - new Date(opp)) / 60000);
      $("#dag-lengd").textContent = `Dagslengde ${Math.floor(mins/60)} t ${mins%60} min`;
    }
  }catch(e){ console.warn("met.no sunrise feil:", e); }

  // --- Pollen via proxy-funksjon (NAAF-data fra Yr, server-side) ---
  if(!CONFIG.pollenApi) return;
  try{
    const r = await fetch(CONFIG.pollenApi, {cache:"no-store"});
    const j = await r.json();
    const liste = $("#pollen-liste");
    liste.innerHTML = "";
    // Proxy returnerer: { pollen: [{navn, nivaa}, ...] }
    const pollen = j?.pollen || [];
    if(pollen.length){
      pollen.forEach(p => {
        const farge = POLLEN_FARGE[p.nivaa] || "#aaa";
        const rad = document.createElement("div");
        rad.className = "pollen-rad";
        rad.innerHTML = `<span class="pollen-namn">${p.navn}</span>
          <span class="pollen-nivaa" style="background:${farge}">${p.nivaa}</span>`;
        liste.appendChild(rad);
      });
    } else {
      liste.innerHTML = `<span style="color:var(--blekk-mjuk);font-size:.85rem">Ingen pollendata</span>`;
    }
  }catch(e){
    console.warn("Pollen feil:", e);
    $("#pollen-liste").innerHTML = `<span style="color:var(--blekk-mjuk);font-size:.85rem">—</span>`;
  }
}

/* ---------- Klokke ---------- */
function tikk(){
  const n=new Date();
  $("#klokke").textContent=n.toLocaleTimeString("no",{hour:"2-digit",minute:"2-digit"});
  $("#dato").textContent=n.toLocaleDateString("no",{weekday:"long",day:"numeric",month:"long"});
}

/* ---------- Oppstart ---------- */
byggBadeKort();
tikk(); setInterval(tikk, 30000);
hentBade(); hentBadevann(); hentLuft(); hentVaer();
setInterval(() => { hentBade(); hentBadevann(); hentLuft(); hentVaer(); }, CONFIG.oppdaterMs);
</script>
