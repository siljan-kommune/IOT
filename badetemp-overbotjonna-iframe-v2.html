<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badetemperatur Øverbøtjønna</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src https://fdqjiubwnohtucpercro.supabase.co; script-src 'unsafe-inline';">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: transparent;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .card {
            background: #1a4d2e;
            border-radius: 14px;
            padding: 20px 28px;
            text-align: center;
            color: white;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .location {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .sublocation {
            font-size: 0.72rem;
            opacity: 0.6;
            margin-bottom: 14px;
        }
        .temp {
            font-size: 3.2rem;
            font-weight: 300;
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 10px;
        }
        .temp sup {
            font-size: 1.2rem;
            font-weight: 400;
            vertical-align: super;
            opacity: 0.8;
        }
        .status {
            font-size: 0.75rem;
            opacity: 0.55;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="location">Øverbøtjønna</div>
    <div class="sublocation">Siljan kommune</div>
    <div class="temp" id="temp">--<sup>°C</sup></div>
    <div class="status" id="status">Henter temperatur...</div>
</div>
<script>
const SUPA_URL  = 'https://fdqjiubwnohtucpercro.supabase.co';
const SUPA_ANON = 'sb_publishable_kOLJyLytSLcQvmIgNg8nDQ_HZzIHvcL';

async function fetchTemp() {
    try {
        const resp = await fetch(
            SUPA_URL + '/rest/v1/badetemperatur?temperatur=neq.96&order=rapportert.desc&limit=1',
            { headers: { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON } }
        );
        const data = await resp.json();
        if (!data?.length) { document.getElementById('status').textContent = 'Ingen målinger'; return; }

        const row  = data[0];
        const temp = parseFloat(row.temperatur);
        if (isNaN(temp) || temp < 2 || temp > 30) { document.getElementById('status').textContent = 'Ugyldig verdi'; return; }

        document.getElementById('temp').innerHTML = temp.toFixed(1) + '<sup>°C</sup>';

        const dt    = new Date(row.rapportert);
        const diffH = (Date.now() - dt) / 3600000;
        const tid   = dt.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
        const dato  = dt.toLocaleDateString('no-NO', { day: 'numeric', month: 'short' });
        document.getElementById('status').textContent = diffH < 24
            ? 'Sist målt kl. ' + tid
            : 'Sist målt ' + dato + ' kl. ' + tid;

    } catch (e) {
        document.getElementById('status').textContent = 'Kunne ikke hente data';
    }
}

fetchTemp();
setInterval(fetchTemp, 300000);
</script>
</body>
</html>
